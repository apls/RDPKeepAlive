name: Release executable

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: RDPKeepAlive.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
  
    # Build with MSBuild (.NET Framework 4.0)
    - name: Build solution
      run: msbuild $env:Solution_Name /p:Configuration=Release /p:OutputPath=..\..\publish\ /t:Build

    # Remove PDB files from release
    - name: Remove PDB files
      run: Remove-Item .\publish\*.pdb -ErrorAction SilentlyContinue

    # List output
    - name: List output files
      shell: pwsh
      run: Get-ChildItem .\publish\

    # Upload artifact
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RDPKeepAlive
        path: .\publish\RDPKeepAlive.exe

    # Release
    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: publish/RDPKeepAlive.exe
