name: Release executable

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"

jobs:

  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Download .NET 4.0 Reference Assemblies via NuGet
      run: |
        nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory D:\a\frameworks

    - name: Build Solution
      run: |
        msbuild src\RDPKeepAlive.sln /p:Configuration=Release /t:Build /p:TargetFrameworkRootPath=D:\a\frameworks\Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3\build\.NETFramework\
  
#    - name: Build solution
#      run: msbuild src\RDPKeepAlive.sln /p:Configuration=Release /t:Build

    - name: Remove PDB files
      run: del /Q src\RDPKeepAlive\bin\Release\*.pdb 2>nul
      shell: cmd

    - name: List output files
      run: dir src\RDPKeepAlive\bin\Release\
      shell: cmd

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: RDPKeepAlive
        path: src\RDPKeepAlive\bin\Release\RDPKeepAlive.exe

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: src/RDPKeepAlive/bin/Release/RDPKeepAlive.exe
