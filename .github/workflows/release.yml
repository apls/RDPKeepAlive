name: Release executable

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: RDPKeepAlive.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Build with MSBuild (.NET Framework 4.0)
    - name: Build solution
      shell: pwsh
      run: |
        $env:MSBUILD_PATH = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
        & $env:MSBUILD_PATH $env:Solution_Name /p:Configuration=Release

    # Remove PDB files
    - name: Remove PDB files
      shell: pwsh
      run: Remove-Item .\src\RDPKeepAlive\bin\Release\*.pdb -ErrorAction SilentlyContinue

    # List output
    - name: List output files
      shell: pwsh
      run: Get-ChildItem .\src\RDPKeepAlive\bin\Release\

    # Upload artifact
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RDPKeepAlive
        path: .\src\RDPKeepAlive\bin\Release\RDPKeepAlive.exe

    # Release
    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: src/RDPKeepAlive/bin/Release/RDPKeepAlive.exe
